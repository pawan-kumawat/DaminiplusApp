name: damini_plusapp
description: "A new student study app."

publish_to: 'none'

version: 1.0.0+9

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.1
  shared_preferences: ^2.3.5
  http: ^1.2.2
  image_picker: ^1.1.2
  webview_flutter: ^4.10.0
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  in_app_purchase: ^3.2.0
  onesignal_flutter: ^5.2.4
  pinput: ^5.0.0
  flutter_pdfview: ^1.3.4
  path_provider: ^2.1.5
  provider:
  audioplayers:
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  flutter_math_fork: ^0.7.4
  google_mobile_ads: ^5.2.0
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/AppLogoWBG.png"
  min_sdk_android: 21
  remove_alpha_ios: true


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/image/
    - assets/videos/
    - assets/html/



